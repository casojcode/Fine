<style>
/* Layout: coluna única de celular (máx. 560px), cabeçalho fixo, conteúdo rolável, navegação inferior. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#14262A; --muted:#5C6F72; --line:#D9E1E0;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#DCEEEC;
  --neg:#B23A2B; --pos:#22794A; --warn:#A8690A; --warn-soft:#FBEFD6; --neg-soft:#F8E2DE;
  --logo-ink:#0F2A24; --logo-acc:#0C8F67;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1719; --surface:#17252A; --ink:#E6EEEC; --muted:#93A6A8; --line:#2A3D42;
    --accent:#4FB8B0; --accent-ink:#06211F; --accent-soft:#1D3A3B;
    --neg:#F0806F; --pos:#6CCB93; --warn:#E5B04E; --warn-soft:#3A2F16; --neg-soft:#3E2320;
    --logo-ink:#E6EEEC; --logo-acc:#3DDC97;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1719; --surface:#17252A; --ink:#E6EEEC; --muted:#93A6A8; --line:#2A3D42;
  --accent:#4FB8B0; --accent-ink:#06211F; --accent-soft:#1D3A3B;
  --neg:#F0806F; --pos:#6CCB93; --warn:#E5B04E; --warn-soft:#3A2F16; --neg-soft:#3E2320;
  --logo-ink:#E6EEEC; --logo-acc:#3DDC97;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
.logo{display:flex;align-items:center;font-family:"Sora",var(--display);font-weight:800;font-size:26px;letter-spacing:-.04em;line-height:1;color:var(--logo-ink);margin:0}
.logo .cif{width:.6em;height:1.2em;margin-left:.02em;margin-top:.08em}
html.modo-teste #app::before{content:"MODO TESTE · dados separados dos reais";display:block;background:#B23A2B;color:#fff;font:600 12px var(--body);text-align:center;padding:4px;letter-spacing:.04em}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.x-unused{font-family:var(--display);font-size:20px;font-weight:600;margin:0;letter-spacing:.01em}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:500 12.5px var(--body);padding:12px 2px 14px;border-top:3px solid transparent;cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
nav button.plus{flex:0 0 76px;border-top-color:transparent;padding:0;display:flex;align-items:center;justify-content:center}
nav button.plus span{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:400 32px/1 var(--body);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(11,40,40,.25);border:3px solid var(--bg)}
nav button.plus[aria-current="page"] span{outline:2px solid var(--accent);outline-offset:2px}
nav{overflow:visible;position:relative;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#app{padding-top:env(safe-area-inset-top);box-sizing:border-box}
/* a tela não rola inteira: só o conteúdo do meio; topo e barra de baixo ficam fixos */
html,body{overflow:hidden;overscroll-behavior:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;height:auto;margin:0 auto}
main{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
main>*{flex-shrink:0}
.subtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.subtabs button{flex:1 1 auto;min-width:0;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 4px;font:500 12px var(--body);color:var(--muted);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.vrow:first-of-type{border-top:0}
.vrow .dt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:42px}
button,input,select{font-family:inherit;font-size:15px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.neg{color:var(--neg)}.pos{color:var(--pos)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1;min-width:0}
input[type=text],input[type=date],input[type=month],input[type=number],select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.valor{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);padding:2px 0 4px}
.valor span{font-family:var(--display);font-size:22px;color:var(--muted)}
.valor input{border:0;background:none;font-family:var(--display);font-size:40px;font-weight:600;padding:0;min-height:52px;width:100%;font-variant-numeric:tabular-nums}
.valor input:focus{outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.t button[aria-pressed="true"][data-v="D"]{background:var(--neg);color:#fff}
.seg.t button[aria-pressed="true"][data-v="R"]{background:var(--pos);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.cc::before{content:"";display:inline-block;width:9px;height:7px;border:1.5px solid currentColor;border-radius:2px;margin-right:6px;opacity:.7}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{width:100%;font-size:16px;min-height:50px}
.btn.dng{color:var(--neg);border-color:var(--neg)}
.btn.lnk{border:0;background:none;color:var(--accent);padding:6px 4px;min-height:0}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.mnav b{min-width:88px;text-align:center;font-family:var(--display);font-size:17px;font-weight:600}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.it:first-child{border-top:0}
.it .t1{font-weight:500;overflow-wrap:anywhere}
.invbox{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.it .bar{margin:6px 0 2px}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--neg-soft);color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;min-width:0}
.tile span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile b{display:block;font-family:var(--display);font-size:clamp(14px,4.4vw,19px);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar i.over{background:var(--neg)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.banner{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
textarea{width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
input.calc::placeholder{color:var(--accent);font-weight:600;opacity:1}
.tagc{display:none;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:6px}
.tagc.on{display:inline-block}
.taxa-row{display:flex;gap:6px;align-items:stretch}.taxa-row input{flex:1;min-width:0}.taxa-row .seg{flex:none}.taxa-row .seg button{padding:6px 9px;font-size:13px}
.chip.more{border-style:dashed;color:var(--muted)}
.gh{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);font:600 15px var(--body);text-align:left}
.gh .ed{color:var(--accent);font-weight:500;font-size:13px}
.boxf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;background:rgba(8,20,22,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
#sheet .box{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
#sheet .box>*{flex-shrink:0}
#sheet h3{margin:0;font-family:var(--display);font-size:19px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.list button.go{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;cursor:pointer;text-align:left;font-size:15.5px}
.list button.go:first-child{border-top:0}
svg text{font-family:var(--body);font-size:10.5px;fill:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
th{font-weight:600;color:var(--muted);font-size:12px;border-top:0}
td:first-child,th:first-child{text-align:left}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<div id="app">
  <header><h1 id="ttl" class="logo" aria-label="Fine"><span>fin</span><svg viewBox="18 -8 164 336" aria-hidden="true" class="cif"><path d="M40 100 H160 A60 60 0 1 0 100 160" fill="none" stroke="var(--logo-ink)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 160 A60 60 0 1 1 40 220 H160" fill="none" stroke="var(--logo-acc)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 8 V40 M100 280 V312" fill="none" stroke="var(--logo-ink)" stroke-width="28" stroke-linecap="round"/></svg></h1><div id="hdr"></div></header>
  <main id="main"><div class="empty">Carregando seus dados…</div></main>
  <nav id="nav"></nav>
</div>

<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".xlsx,.json,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" aria-label="Arquivo de backup">
<script>
"use strict";
/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const ymOf=s=>s.slice(0,7);
const addM=(ym,n)=>{let [y,m]=ym.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+p2(m+1)};
const diffM=(a,b)=>{const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)};
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mLab=ym=>MES[+ym.slice(5,7)-1]+"/"+ym.slice(0,4);
const mLabS=ym=>MES[+ym.slice(5,7)-1]+"/"+ym.slice(2,4);
const dLab=s=>s.slice(8,10)+"/"+s.slice(5,7);
const brl=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const r2=v=>Math.round(v*100)/100;
function parseVal(s){s=String(s==null?"":s).trim().replace(/[R$\s]/g,"");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0}
const numIn=v=>v?String(r2(v)).replace(".",","):"";
function dateInMonth(ym,day){const [y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return ym+"-"+p2(Math.min(Math.max(+day||1,1),last))}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),3200)}

/* ---------- regras de negócio (funções puras) ---------- */
// Mês da fatura (mês do vencimento) de uma compra no cartão.
function fatMonth(conta,dateStr){
  const m=ymOf(dateStr);
  if(!conta||conta.tipo!=="cartao")return m;
  const f=+conta.fech||0;if(!f)return addM(m,1);
  const day=+dateStr.slice(8,10);
  const closeM=day<f?m:addM(m,1);            // compra no dia do fechamento já cai na fatura seguinte
  const v=+conta.venc||0;
  const sameMonth=v?v>f:(f+7<=28);
  return sameMonth?closeM:addM(closeM,1);
}
// Datas de fechamento e vencimento da fatura do mês ym.
function fatDates(conta,ym){
  const f=+conta.fech||0,v=+conta.venc||0;if(!f)return null;
  const sameMonth=v?v>f:(f+7<=28);
  return {fech:dateInMonth(sameMonth?ym:addM(ym,-1),f),venc:v?dateInMonth(ym,v):null};
}
function impliedRate(pv,pmt,n){
  if(!(pv>0&&pmt>0&&n>0)||pmt*n<=pv)return 0;
  let lo=0,hi=1;
  for(let k=0;k<80;k++){const i=(lo+hi)/2;const val=pmt*(1-Math.pow(1+i,-n))/i;if(val>pv)lo=i;else hi=i}
  return (lo+hi)/2;
}
const pmtOf=(pv,i,n)=>i>0?pv*i/(1-Math.pow(1+i,-n)):pv/n;
/* ---------- dívidas: juros efetivos, conversões e cálculo do campo vazio ---------- */
const a2m=a=>Math.pow(1+a,1/12)-1, m2a=m=>Math.pow(1+m,12)-1;
const fmtPct=v=>(v*100).toLocaleString("pt-BR",{minimumFractionDigits:3,maximumFractionDigits:3});
const pctIn=v=>(v*100).toFixed(3).replace(".",",");
const unPadrao=tipo=>tipo==="financiamento"?"a":"m";
function setUn(d,un){if(d.un===un)return;if(String(d.taxa||"").trim()!==""){const r=parseVal(d.taxa)/100;const m=d.un==="a"?a2m(r):r;d.taxa=pctIn(un==="a"?m2a(m):m)}d.un=un}
function calcDiv(d){ // preenchidos dois entre parcela, nº de parcelas e juros, calcula o terceiro (Price ou SAC)
  const contrato=d.modo==="contrato",sac=d.sis==="sac",un=d.un||"m";
  const S0=parseVal(contrato?d.valor:d.saldo);const tem=k=>String(d[k]==null?"":d[k]).trim()!=="";
  let n=parseInt(d.n)||0,P=parseVal(d.parcela);const r=parseVal(d.taxa)/100;let i=tem("taxa")?(un==="a"?a2m(r):r):null;
  const has={P:tem("parcela")&&P>0,n:tem("n")&&n>0,i:tem("taxa")&&r>=0};
  const res={S0,calc:null,erro:"",aviso:""};
  if(!(S0>0)){res.erro=contrato?"Informe o valor do contrato.":"Informe o saldo devedor.";return res}
  const cnt=has.P+has.n+has.i;
  if(cnt<2){res.erro="Preencha dois entre "+(sac?"1ª parcela":"parcela")+", nº de parcelas e juros: o terceiro é calculado.";return res}
  if(cnt===2){
    if(!has.P){P=sac?S0/n+S0*i:pmtOf(S0,i,n);res.calc="parcela"}
    else if(!has.n){
      if(P<=S0*i&&!(i===0)){res.erro="Com esses juros, a "+(sac?"1ª parcela":"parcela")+" não cobre nem os juros do mês.";return res}
      n=sac?Math.ceil(S0/(P-S0*i)-1e-9):i===0?Math.ceil(S0/P-1e-9):Math.ceil(-Math.log(1-S0*i/P)/Math.log(1+i)-1e-9);res.calc="n"}
    else{
      if(sac){i=(P-S0/n)/S0;if(i<-1e-9){res.erro="A 1ª parcela é menor que a amortização (valor ÷ nº de parcelas). Confira os valores.";return res}i=Math.max(i,0)}
      else{if(P*n<S0-0.01){res.erro="Parcela × nº de parcelas é menor que o valor. Confira os valores.";return res}i=impliedRate(S0,P,n)}
      res.calc="taxa"}
  }else{const Pc=sac?S0/n+S0*i:pmtOf(S0,i,n);
    if(Math.abs(Pc-P)>Math.max(1,P*0.01))res.aviso="Os três valores não batem: com esses juros e esse prazo, a "+(sac?"1ª parcela":"parcela")+" seria "+brl(Pc)+". Apague o campo que deve ser calculado."}
  Object.assign(res,{n,P,i});return res;
}
function montaDiv(d,res,old){

// Cronograma de uma dívida a partir do mês de referência (saldo informado vale após a parcela de d.ref).
function sched(d){
  const rows=[];let s=+d.saldo||0,m=d.ref,k=0;const i=+d.taxa||0;
  const am=d.sis==="sac"?s/Math.max(+d.n||1,1):0;const ex=d.extras||{};
  while(s>0.005&&k<600){
    m=addM(m,1);k++;const j=s*i;
    let pago=d.sis==="sac"?Math.min(s,am)+j:Math.min(+d.parcela||0,s+j);
    if(d.sis!=="sac"&&d.semTaxaFim&&k===+d.n)pago=s+j;
    s=s-(pago-j);const e=Math.min(+ex[m]||0,Math.max(s,0));s-=e;
    rows.push({m,j,pago,ex:e,s:Math.max(s,0)});
    if(pago-j<=0&&!e&&k>3&&d.sis!=="sac"){rows.bad=true;break}
  }
  return rows;
}
// Simulação do plano de quitação. debts: [{id,nome,s,i,pay,am,sac}]
function simPlano(debts,extra,estr,start,rollover){
  const L=debts.map(d=>({...d,base:d.sac?d.am+d.s*d.i:d.pay}));let m=start,juros=0,k=0,freed=0;const ordem=[];
  while(L.some(d=>d.s>0.005)&&k<600){
    m=addM(m,1);k++;
    for(const d of L){if(d.s<=0.005)continue;const j=d.s*d.i;juros+=j;const p=d.sac?Math.min(d.s,d.am)+j:Math.min(d.pay,d.s+j);d.s-=(p-j)}
    let pool=extra+(rollover?freed:0);
    const alive=()=>L.filter(d=>d.s>0.005).sort((a,b)=>estr==="menor"?a.s-b.s:(b.i-a.i)||(a.s-b.s));
    while(pool>0.005){const t=alive()[0];if(!t)break;const x=Math.min(pool,t.s);t.s-=x;pool-=x}
    for(const d of L){if(d.s<=0.005&&!d.fim){d.fim=m;d.s=0;freed+=d.base;ordem.push({nome:d.nome,m})}}
  }
  return {meses:k,fim:m,juros,ordem,travou:k>=600};
}

    for(let k=pa;k<=pt;k++){const m=addM(fat,k-pa);const mes=clone(getMes(m));
      mes.itens.push({...base,id:uid(),d:k===pa?F.d:dateInMonth(addM(ymOf(F.d),k-pa),day),v:vp,pn:k,pt,pg,ts:Date.now()+k-pa});saveMes(m,mes)}
    msg=`Lançadas ${pt-pa+1} parcelas de ${brl(vp)} (${mLabS(fat)} a ${mLabS(addM(fat,pt-pa))}).`;
  }else{
    const mes=clone(getMes(fat));mes.itens.push({...base,id:uid(),v:r2(v),ts:Date.now()});saveMes(fat,mes);
    msg=`Lançado: ${brl(v)} em ${F.g}${card?" · fatura "+mLabS(fat):""}.`;
  }
  F=newForm(F);toast(msg);render();
}

function barrasGrupos(m,names,by,comMedia){const prev={};if(comMedia)for(let k=1;k<=3;k++)for(const i of getMes(addM(m,-k)).itens)if(i.t==="D")prev[i.g]=(prev[i.g]||0)+i.v/3;
  let h="";for(const n of names){const v=by[n]||0,meta=+S.cfg.metas[n]||0;const mx=Math.max(v,meta)*1.08||1;

    <div class="bar" style="margin:6px 0 2px"><i class="${meta&&v>meta?"over":""}" style="width:${v/mx*100}%"></i>${meta?`<u style="left:${meta/mx*100}%"></u>`:""}</div>
    ${prev[n]?`<div class="small muted">média dos 3 meses anteriores: ${brl0(prev[n])}</div>`:""}</div>`}

function tilesMes(m){const its=itemsOf(m),rec=tot(its,"R"),desp=tot(its,"D"),saldo=rec-desp;

  if(m>CUR)h+=`<div class="small muted">Mês futuro: inclui fixos, parcelas e dívidas já previstos.</div>`;

function grafico6(m){
  const ms=[];for(let k=5;k>=0;k--)ms.push(addM(m,-k));
  const dat=ms.map(x=>{const it=itemsOf(x);return {m:x,r:tot(it,"R"),d:tot(it,"D")}});
  const mx=Math.max(1,...dat.map(x=>Math.max(x.r,x.d)));const W=320,H=120,bw=16;
  let svg=`<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="Receitas e despesas dos últimos 6 meses"><text x="0" y="10">${brl0(mx)}</text><line x1="0" y1="14" x2="${W}" y2="14" stroke="var(--line)"/><line x1="0" y1="${H+14}" x2="${W}" y2="${H+14}" stroke="var(--line)"/>`;
  dat.forEach((x,k)=>{const cx=28+k*((W-56)/5);const hr=x.r/mx*H,hd=x.d/mx*H;
    svg+=`<rect x="${cx-bw-1}" y="${H+14-hr}" width="${bw}" height="${hr}" rx="2" fill="var(--pos)"/><rect x="${cx+1}" y="${H+14-hd}" width="${bw}" height="${hd}" rx="2" fill="var(--neg)"/><text x="${cx}" y="${H+28}" text-anchor="middle">${mLabS(x.m)}</text>`});
  return `<div class="card"><div class="row sp"><h2>Receitas e despesas · 6 meses</h2><span class="small"><span class="pos">■</span> receitas <span class="neg">■</span> despesas</span></div>${svg}</svg></div>`;
}
// Próximos vencimentos (10 dias a partir de hoje): faturas de cartão não pagas, fixos e parcelas de dívidas
function vencimentos(){
  const hoje=todayStr(),lim=(()=>{const d=new Date(hoje+"T12:00:00");d.setDate(d.getDate()+10);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())})();
  const L=[];
  for(const mm of [CUR,addM(CUR,1)]){const its=itemsOf(mm);
    for(const i of its){if(i.t!=="D"||!(i.fx||i.dv))continue;const c=conta(i.c);if(c&&c.tipo==="cartao")continue;if(i.d>=hoje&&i.d<=lim)L.push({d:i.d,n:i.o||i.s||i.g,v:i.v,est:i.est})}
    for(const c of S.cfg.contas.filter(x=>x.tipo==="cartao"&&x.venc)){const due=dateInMonth(mm,c.venc);if(due<hoje||due>lim||(getMes(mm).pagas||{})[c.id])continue;
      const v=its.filter(i=>i.c===c.id&&i.t==="D").reduce((a,i)=>a+i.v,0);if(v>0)L.push({d:due,n:"Fatura "+c.n,v})}}
  return L.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}

/* ---------- dicas: 50/30/20 + histórico ---------- */
const CLS=[["E","Necessidade"],["V","Desejo"],["P","Futuro"]];
const CLS_PAD={"HABITAÇÃO":"E","ALIMENTAÇÃO":"E","TRANSPORTE":"E","SAÚDE":"E","EDUCAÇÃO":"E","DÍVIDAS":"E","ANTECIPAÇÃO":"P"};
const clsDe=g=>((S.cfg.reco||{}).cls||{})[g]||CLS_PAD[g]||"V";
const ALVO={E:.5,V:.3,P:.2};
function baseReco(){
  // meses completos recentes com lançamentos (até 3), para médias
  const ms=[];for(let k=1;k<=6&&ms.length<3;k++){const m=addM(CUR,-k);if(getMes(m).itens.length)ms.push(m)}
  const n=ms.length;const grp={};let rec=0;
  for(const m of ms)for(const i of getMes(m).itens){if(i.t==="R"){rec+=i.v;continue}
    const g=grp[i.g]||(grp[i.g]={tot:0,fixo:0});g.tot+=i.v;if(comprometido(i))g.fixo+=i.v}
  for(const g in grp){grp[g].tot/=n||1;grp[g].fixo/=n||1}
  const recFix=(S.cfg.fixos||[]).filter(f=>f.t==="R"&&f.ativo!==false).reduce((a,f)=>a+(+f.v||0),0);
  const manual=+((S.cfg.reco||{}).renda)||0;
  const renda=manual||(n?rec/n:0)||recFix;
  const fonte=manual?"informada por você":n&&rec?`média das receitas de ${ms.length===1?mLabS(ms[0]):mLabS(ms.at(-1))+" a "+mLabS(ms[0])}`:recFix?"receitas fixas cadastradas":"";
  // aplicado em investimentos (aportes − resgates), média
  let apl=0;for(const m of ms)apl+=econMes(m).apl;apl=n?apl/n:0;
  return {ms,n,grp,renda,fonte,apl};
}
function sugestoes(B){
  const tot={E:0,V:0,P:0};for(const g in B.grp)tot[clsDe(g)]+=B.grp[g].tot;
  const out=[];
  for(const g in B.grp){const c=clsDe(g),x=B.grp[g];if(c==="P"||x.tot<=0)continue;
    if(x.tot-x.fixo<10)continue; // só fixos, parcelas e dívidas: nada a cortar
    const atual=+S.cfg.metas[g]||0,alvoC=B.renda*ALVO[c];let sug;
    if(tot[c]>alvoC){sug=Math.max(x.tot*alvoC/tot[c],x.fixo+(x.tot-x.fixo)*.85);sug=Math.ceil(sug/10)*10;if(atual&&atual<sug)sug=atual}
    else sug=atual||Math.ceil(x.tot/10)*10; // dentro da regra: mantém a meta atual
    out.push({g,c,media:x.tot,fixo:x.fixo,sug,atual})}
  return {tot,lista:out.sort((a,b)=>b.media-a.media)};
}
function vDicas(){
  const B=baseReco();let h="";
  if(!B.n||!B.renda){return h+`<div class="card"><h2>Dicas</h2><div class="empty">As dicas usam os seus últimos meses de lançamentos e a sua renda. Lance pelo menos um mês completo, com as receitas, ou informe a renda.</div><button class="btn" data-a="recoCfg">Informar renda e classificar grupos</button></div>`}
  const SG=sugestoes(B),R=B.renda;
  // 1. 50/30/20
  const real={E:SG.tot.E/R,V:SG.tot.V/R,P:Math.max(R-SG.tot.E-SG.tot.V,0)/R};
  const nome={E:"Necessidades",V:"Desejos",P:"Futuro (sobra para guardar)"};
  h+=`<div class="card"><div class="row sp"><h2>Regra 50/30/20</h2><button class="btn lnk" data-a="recoCfg">Ajustar</button></div>
  <div class="small muted">Renda considerada: <b>${brl0(R)}</b> por mês (${esc(B.fonte)}). Gastos: média de ${B.n===1?"1 mês":B.n+" meses"}.</div>`;
  for(const c of ["E","V","P"]){const p=real[c],a=ALVO[c],ruim=c==="P"?p<a:p>a;
    h+=`<div><div class="row sp"><span>${nome[c]}</span><span class="num ${ruim?"neg":"pos"}">${Math.round(p*100)}% <span class="muted small">/ ${a*100}%</span></span></div><div class="bar" style="margin:6px 0 2px"><i class="${ruim&&c!=="P"?"over":""}" style="width:${Math.min(p,1)*100}%"></i><u style="left:${a*100}%"></u></div></div>`}
  h+=`</div>`;
  // 2. metas sugeridas
  const muda=SG.lista.filter(s=>Math.abs(s.sug-s.atual)>=10);
  h+=`<div class="card"><h2>Metas sugeridas</h2>`;
  if(!SG.lista.length)h+=`<div class="empty">Sem gastos suficientes para sugerir metas.</div>`;
  else{h+=`<div class="small muted">Para chegar perto dos 50/30/20 sem cortes impossíveis: no máximo 15% a menos por grupo, só na parte variável. Onde a categoria já está dentro da regra, a meta atual é mantida. Grupos só com fixos, parcelas e dívidas ficam de fora.</div><div style="overflow-x:auto"><table><tr><th>Grupo</th><th>Média</th><th>Meta atual</th><th>Sugerida</th></tr>${SG.lista.map(s=>`<tr><td>${esc(s.g)}</td><td class="num">${n0(s.media)}</td><td class="num">${s.atual?n0(s.atual):"—"}</td><td class="num"><b>${n0(s.sug)}</b></td></tr>`).join("")}</table></div>`;
    h+=muda.length?`<button class="btn pri" data-a="applyReco">Aplicar ${muda.length} sugest${muda.length>1?"ões":"ão"}</button>`:`<div class="small muted">Suas metas já estão alinhadas com a sugestão.</div>`}
  h+=`</div>`;
  // 3. reserva de emergência
  const essMes=SG.tot.E,alvoRes=essMes*6;let res=0;const lq=invs().filter(v=>v.liq!=="venc");for(const v of lq)res+=invNoMes(v.id,CUR).sd;
  h+=`<div class="card"><h2>Reserva de emergência</h2><div class="small muted">Referência: 6 meses de necessidades (${brl0(essMes)} por mês). Conta o que está em investimentos de resgate a qualquer hora.</div>
  <div class="row sp"><span>${brl0(res)} de ${brl0(alvoRes)}</span><b>${alvoRes?Math.min(Math.round(res/alvoRes*100),100):0}%</b></div><div class="bar"><i style="width:${alvoRes?Math.min(res/alvoRes,1)*100:0}%"></i></div>
  ${res>=alvoRes?`<div class="small pos">Reserva completa. O que guardar daqui em diante pode ir para objetivos de prazo mais longo.</div>`:`<div class="small">Faltam <b>${brl0(alvoRes-res)}</b>.${B.apl>0?` No ritmo atual (${brl0(B.apl)}/mês), cerca de ${Math.ceil((alvoRes-res)/B.apl)} meses.`:""}</div>`}
  ${lq.length?"":`<div class="small muted">Cadastre sua reserva em Planejar › Economias para acompanhar aqui.</div>`}</div>`;
  // 4. peso das dívidas
  let parc=0;for(const d of S.cfg.dividas||[]){const r=schedOf(d).find(q=>q.m===CUR);if(r)parc+=r.pago+(+d.enc||0)}
  const cartaoParc=getMes(CUR).itens.filter(i=>i.pt&&i.t==="D").reduce((a,i)=>a+i.v,0);const pd=(parc+cartaoParc)/R;
  const abertas=(S.cfg.dividas||[]).filter(d=>saldoAt(d,CUR)>1).sort((a,b)=>(+b.taxa||0)-(+a.taxa||0));
  h+=`<div class="card"><h2>Peso das dívidas</h2><div class="row sp"><span>Parcelas de ${mLabS(CUR)} (dívidas ${brl0(parc)} + compras parceladas ${brl0(cartaoParc)})</span><b class="${pd>.3?"neg":"pos"}">${Math.round(pd*100)}% da renda</b></div>
  <div class="small muted">Referência comum: até 30% da renda em parcelas.${pd>.3?" Acima disso, evite novas parcelas até reduzir.":""}</div>`;
  if(abertas.length){const t=abertas[0];h+=`<div class="small" style="margin-top:6px">Se sobrar dinheiro para antecipar, comece por <b>${esc(t.nome)}</b>: tem os juros mais altos (${fmtPct(+t.taxa)}% a.m.). Pagar a dívida mais cara primeiro é o que mais economiza juros.</div>`}
  h+=`</div>`;
  // 5. onde cortar
  const cortes=SG.lista.filter(s=>s.c!=="P").map(s=>{const meta=s.atual||s.sug;return {...s,lib:s.media-Math.max(meta,s.fixo)}}).filter(s=>s.lib>=10&&s.media-s.fixo>0).sort((a,b)=>b.lib-a.lib).slice(0,3);
  h+=`<div class="card"><h2>Onde cortar</h2>${cortes.length?cortes.map(s=>`<div class="row sp"><span>${esc(s.g)} <span class="small muted">(${CLS.find(x=>x[0]===s.c)[1].toLowerCase()})</span></span><span class="num">libera ${brl0(s.lib)}/mês</span></div>`).join("")+`<div class="small muted">Diferença entre a sua média e a meta${SG.lista.some(s=>!s.atual)?" (ou a sugerida, onde não há meta)":""}, só na parte variável.</div>`:`<div class="small muted">Nenhum grupo acima da meta na média recente.</div>`}</div>`;
  // 6. quanto investir
  const sobra=Math.max(R-SG.tot.E-SG.tot.V,0),meta20=R*.2,sugAp=Math.min(sobra,meta20);
  h+=`<div class="card"><h2>Quanto investir por mês</h2><div class="row sp"><span>Sugestão</span><b>${brl0(sugAp)}</b></div>
  <div class="small muted">20% da renda seria ${brl0(meta20)}; hoje sobram em média ${brl0(sobra)} e você aplica ${brl0(B.apl)}.${res<alvoRes?" Enquanto a reserva não estiver completa, coloque esse valor nela.":""}${sobra<meta20?" Os cortes acima ajudam a chegar nos 20%.":""}</div></div>`;
  h+=`<div class="small muted">Sugestões educativas, calculadas com os seus lançamentos e a regra 50/30/20 (Elizabeth Warren e Amelia Warren Tyagi, 2005). Não substituem a orientação de um profissional.</div>`;
  return h;
}

/* ---------- dívidas ---------- */
const saldoAt=(d,m)=>{if(m<=d.ref)return +d.saldo;const r=schedOf(d);const x=r.filter(q=>q.m<=m).pop();return x?x.s:+d.saldo};
function cartaoFuturo(){const out={};for(const m in S.meses){if(m<=CUR)continue;for(const i of S.meses[m].itens)if(i.pt&&i.t==="D")out[m]=(out[m]||0)+i.v}return out}
function vDividas(){
  const ds=S.cfg.dividas||[];const cf=cartaoFuturo();const cfTot=Object.values(cf).reduce((a,b)=>a+b,0);
  const sdTot=ds.reduce((a,d)=>a+saldoAt(d,CUR),0);
  const jPagos=ds.reduce((a,d)=>a+schedOf(d).filter(r=>r.m<=CUR).reduce((x,r)=>x+r.j,0),0);

function vFixos(){

function vMetas(){

function remapItens(fn){ // aplica fn a todos os lançamentos; grava só os meses alterados
  for(const m of Object.keys(S.meses)){const mes=clone(S.meses[m]);let ch=false;for(const i of mes.itens)if(fn(i))ch=true;if(ch)saveMes(m,mes)}
}
function renomearGrupo(t,old,nv){
  const g=grupos(t).find(x=>x.n===old);if(!g)return;
  if(grupos(t).some(x=>x.n===nv&&x!==g)){toast("Já existe um grupo "+nv+". Para juntar os dois, exclua este e escolha "+nv+" como destino.");return false}
  g.n=nv;if(S.cfg.metas[old]!=null){S.cfg.metas[nv]=S.cfg.metas[old];delete S.cfg.metas[old]}
  for(const f of S.cfg.fixos)if(f.t===t&&f.g===old)f.g=nv;
  remapItens(i=>{if(i.t===t&&i.g===old){i.g=nv;return true}});
  ordenaCfg(S.cfg);saveCfg();return true;
}
function excluirGrupo(t,old,dest){
  const lista=grupos(t),g=lista.find(x=>x.n===old);if(!g)return;
  if(dest){const dg=lista.find(x=>x.n===dest);
    const subs=new Set();remapItens(i=>{if(i.t===t&&i.g===old){i.g=dest;if(i.s)subs.add(i.s);return true}});
    for(const f of S.cfg.fixos)if(f.t===t&&f.g===old){f.g=dest;if(f.s)subs.add(f.s)}
    for(const x of subs)if(!dg.s.includes(x))dg.s.push(x);
    if(S.cfg.metas[old]!=null&&S.cfg.metas[dest]==null)S.cfg.metas[dest]=S.cfg.metas[old];
  }
  delete S.cfg.metas[old];lista.splice(lista.indexOf(g),1);ordenaCfg(S.cfg);saveCfg();
}
function renomearSub(t,gn,old,nv){
  const g=grupos(t).find(x=>x.n===gn);if(!g)return;
  if(g.s.includes(nv))g.s.splice(g.s.indexOf(old),1);else g.s[g.s.indexOf(old)]=nv;
  for(const f of S.cfg.fixos)if(f.t===t&&f.g===gn&&f.s===old)f.s=nv;
  remapItens(i=>{if(i.t===t&&i.g===gn&&i.s===old){i.s=nv;return true}});
  ordenaCfg(S.cfg);saveCfg();
}
function moverSub(t,gn,old,dest){ // leva o subgrupo (e seus lançamentos e fixos) para outro grupo
  const g=grupos(t).find(x=>x.n===gn),dg=grupos(t).find(x=>x.n===dest);if(!g||!dg||gn===dest)return;
  g.s.splice(g.s.indexOf(old),1);if(!dg.s.includes(old))dg.s.push(old);
  for(const f of S.cfg.fixos)if(f.t===t&&f.g===gn&&f.s===old)f.g=dest;
  remapItens(i=>{if(i.t===t&&i.g===gn&&i.s===old){i.g=dest;return true}});
  S.cfg=ordenaCfg(S.cfg);saveCfg();
}
function excluirSub(t,gn,old){
  const g=grupos(t).find(x=>x.n===gn);if(!g)return;g.s.splice(g.s.indexOf(old),1);
  for(const f of S.cfg.fixos)if(f.t===t&&f.g===gn&&f.s===old)f.s="";
  remapItens(i=>{if(i.t===t&&i.g===gn&&i.s===old){i.s="";return true}});
  saveCfg();
}

function blocoFixo(d){
  if(d.pg||d.dv)return"";
  const f=d.fx&&S.cfg.fixos.find(x=>x.id===d.fx);
  const recChk=`<label class="chk"><input id="s-frec" type="checkbox" data-sc="sh" data-k="fixoRec" data-r="1" ${d.fixoRec!==false?"checked":""}> Valor recorrente (igual todo mês)</label>`;
  const ajuda=d.fixoRec===false?`<div class="small muted">Os próximos meses entram com a média dos 3 últimos valores confirmados, marcados como "estimado".</div>`:"";
  if(f)return `<div class="boxf"><b>Lançamento fixo${f.o?": "+esc(f.o):""}</b>
    ${d.est?`<div class="small muted">Este valor é uma estimativa. Ao salvar, ele passa a valer como confirmado.</div>`:""}
    ${recChk}${ajuda}
    ${d.fixoRec!==false?`<label class="chk"><input id="s-fval" type="checkbox" data-sc="sh" data-k="fixoValFut" ${d.fixoValFut?"checked":""}> Usar este valor nos próximos meses</label>`:""}
    <label class="chk"><input id="s-fenc" type="checkbox" data-sc="sh" data-k="fixoEnc" ${d.fixoEnc?"checked":""}> Encerrar o fixo depois deste mês</label></div>`;
  if(d.fx)return"";
  return `<div class="boxf"><label class="chk"><input id="s-fon" type="checkbox" data-sc="sh" data-k="fixoOn" data-r="1" ${d.fixoOn?"checked":""}> Repete todo mês (fixo)</label>
    ${d.fixoOn?`${recChk}${ajuda}<div class="row">${sin("s-ffim","fixoFim","Termina em (opcional)",d.fixoFim,'type="month"')}</div><div class="small muted">Sem data de término, repete por tempo indeterminado.</div>`:""}</div>`;
}
function findItem(m,id){return getMes(m).itens.find(i=>i.id===id)}
function saveItem(){
  const d=S.sheet.d;const v=parseVal(d.v);if(!(v>0)){toast("Informe o valor.");return}
  if(!/^\d{4}-\d{2}$/.test(d.m)||!d.d){toast("Confira a data e o mês.");return}
  const old=clone(getMes(d.m0));let ix=old.itens.findIndex(i=>i.id===d.id);
  if(ix<0&&d.virt){const base=autoFor(d.m0,old).find(x=>(d.fx&&x.fx===d.fx)||(d.dv&&x.dv===d.dv));if(base){base.id=d.id;old.itens.push(base);ix=old.itens.length-1}}
  if(ix<0){closeSheet();return}
  const it={...old.itens[ix],v:r2(v),o:String(d.o||"").trim(),g:d.g,s:d.s,d:d.d,c:d.c};delete it.est;
  let cfgMudou=false;
  if(!it.fx&&d.fixoOn&&!it.pg&&!it.dv){
    if(d.fixoFim&&d.fixoFim<d.m){toast("O término do fixo precisa ser a partir de "+mLab(d.m)+".");return}
    const f={id:uid(),t:it.t,o:it.o||it.s||it.g,v:it.v,dia:Math.min(Math.max(parseInt(it.d.slice(8,10))||1,1),31),g:it.g,s:it.s||"",c:it.c,ini:d.m,fim:d.fixoFim||"",ativo:true,rec:d.fixoRec!==false};
    S.cfg.fixos.push(f);it.fx=f.id;cfgMudou=true;
  }else if(it.fx){const f=S.cfg.fixos.find(x=>x.id===it.fx);
    if(f){f.rec=d.fixoRec!==false;if(f.rec&&d.fixoValFut)f.v=it.v;if(d.fixoEnc)f.fim=d.m;cfgMudou=true}}
  if(cfgMudou)saveCfg();
  if(d.m===d.m0){old.itens[ix]=it;saveMes(d.m0,old)}
  else{old.itens.splice(ix,1);if(it.fx||it.dv)(old.skip=old.skip||[]).push(it.fx||it.dv);saveMes(d.m0,old);const nw=clone(getMes(d.m));nw.itens.push(it);saveMes(d.m,nw)}
  if(d.pg&&d.prox)for(const m in S.meses){if(m<=d.m)continue;const mes=clone(S.meses[m]);let ch=false;
    for(const x of mes.itens)if(x.pg===d.pg&&x.pn>it.pn){x.v=it.v;x.o=it.o;x.g=it.g;x.s=it.s;ch=true}if(ch)saveMes(m,mes)}
  closeSheet();if(cfgMudou)ensureAuto();toast(d.fixoOn&&!d.fx?"Lançamento atualizado e cadastrado como fixo.":"Lançamento atualizado.");render();
}
function delItem(mode){
  const d=S.sheet.d;
  if(d.virt){const mes=clone(getMes(d.m0));(mes.skip=mes.skip||[]).push(d.fx||d.dv);saveMes(d.m0,mes);closeSheet();toast("Removido de "+mLab(d.m0)+". Os outros meses continuam.");render();return}
  const it=findItem(d.m0,d.id);if(!it){closeSheet();return}
  const ms=mode==="2"&&it.pg?Object.keys(S.meses).filter(m=>m>=d.m0):[d.m0];let n=0;
  for(const m of ms){const mes=clone(getMes(m));const before=mes.itens.length;
    mes.itens=mes.itens.filter(x=>!(x.id===it.id||(mode==="2"&&x.pg===it.pg&&x.pn>=it.pn)));
    if(m===d.m0&&(it.fx||it.dv))(mes.skip=mes.skip||[]).push(it.fx||it.dv);
    if(mes.itens.length!==before){n+=before-mes.itens.length;saveMes(m,mes)}}
  closeSheet();toast(n>1?n+" parcelas excluídas.":"Lançamento excluído.");render();
}
function saveFixo(){
  const d=S.sheet.d;const v=parseVal(d.v);
  if(!String(d.o||"").trim()||!(v>0)||!d.g||!/^\d{4}-\d{2}$/.test(d.ini||"")){toast("Preencha descrição, valor, grupo e mês de início.");return}
  const f={id:d.id||uid(),t:d.t,o:d.o.trim(),v:r2(v),dia:Math.min(Math.max(parseInt(d.dia)||1,1),31),g:d.g,s:d.s||"",c:d.c,ini:d.ini,fim:d.fim||"",ativo:d.ativo!==false,rec:d.rec!==false};
  const ix=S.cfg.fixos.findIndex(x=>x.id===f.id);if(ix>=0)S.cfg.fixos[ix]=f;else S.cfg.fixos.push(f);saveCfg();
  if(d.id&&d.atual){const mes=clone(getMes(CUR));const it=mes.itens.find(i=>i.fx===f.id);if(it){Object.assign(it,{v:f.v,o:f.o,g:f.g,s:f.s,c:f.c,t:f.t,d:dateInMonth(CUR,f.dia)});saveMes(CUR,mes)}}
  closeSheet();ensureAuto();toast("Fixo salvo.");render();
}
function saveDivida(){
  const d=S.sheet.d;
  if(!String(d.nome||"").trim()){toast("Informe o nome da dívida.");return}
  const mesIni=d.modo==="contrato"?d.ini:d.prox;
  if(!/^\d{4}-\d{2}$/.test(mesIni||"")){toast("Informe o mês da "+(d.modo==="contrato"?"1ª":"próxima")+" parcela.");return}
  const res=calcDiv(d);if(res.erro){toast(res.erro);return}if(res.aviso){toast("Os três valores não batem. Apague o campo que deve ser calculado.");return}
  const old=S.cfg.dividas.find(x=>x.id===d.id);const nv=montaDiv(d,res,old);
  const ix=S.cfg.dividas.findIndex(x=>x.id===nv.id);if(ix>=0)S.cfg.dividas[ix]=nv;else S.cfg.dividas.push(nv);
  if(!S.cfg.desp.find(g=>g.n==="DÍVIDAS"))S.cfg.desp.push({n:"DÍVIDAS",s:Object.values(TIPOS)});
  saveCfg();schedCache=new Map();closeSheet();ensureAuto();toast("Dívida salva.");render();
}
function saveExtra(){
  const d=S.sheet.d;const v=parseVal(d.v);const dv=S.cfg.dividas.find(x=>x.id===d.id);
  if(!dv||!(v>0)||!/^\d{4}-\d{2}$/.test(d.m||"")){toast("Informe valor e mês.");return}
  if(d.m<=dv.ref){toast("O mês precisa ser a partir de "+mLab(addM(dv.ref,1))+".");return}
  dv.extras=dv.extras||{};dv.extras[d.m]=r2((dv.extras[d.m]||0)+v);saveCfg();
  if(!S.cfg.desp.find(g=>g.n==="ANTECIPAÇÃO")){S.cfg.desp.push({n:"ANTECIPAÇÃO",s:[]});saveCfg()}
  const mes=clone(getMes(d.m));mes.itens.push({id:uid(),d:d.m===CUR?todayStr():d.m+"-01",t:"D",g:"ANTECIPAÇÃO",s:"",o:"Amortização extra · "+dv.nome,v:r2(v),c:d.c,ts:Date.now()});saveMes(d.m,mes);
  closeSheet();toast("Amortização registrada.");render();
}
function saveConta(){
  const d=S.sheet.d;if(!String(d.n||"").trim()){toast("Informe o nome.");return}
  const c={id:d.id||uid(),n:d.n.trim(),tipo:d.tipo};
  if(c.tipo==="cartao"){c.fech=Math.min(Math.max(parseInt(d.fech)||0,0),31);c.venc=Math.min(Math.max(parseInt(d.venc)||0,0),31)}
  const ix=S.cfg.contas.findIndex(x=>x.id===c.id);if(ix>=0)S.cfg.contas[ix]=c;else S.cfg.contas.push(c);
  saveCfg();closeSheet();toast("Salvo. Lançamentos já feitos continuam na fatura em que estavam.");render();
}
function delConta(){
  const id=S.sheet.d.id;const usado=Object.values(S.meses).some(m=>m.itens.some(i=>i.c===id))||S.cfg.fixos.some(f=>f.c===id);
  if(usado){toast("Há lançamentos ou fixos usando esta forma de pagamento. Ela não pode ser excluída.");return}
  if(S.cfg.contas.length<2){toast("Mantenha pelo menos uma forma de pagamento.");return}

function xset(doc,ref,v){ // v: null limpa; número; texto; {f:"fórmula"}

async function lerBackupXlsx(buf){
  const JSZip=await zipLib();const z=await JSZip.loadAsync(buf);
  const wb=await z.file("xl/workbook.xml").async("string");const m=wb.match(/<sheet [^>]*name="_APP"[^>]*r:id="rId(\d+)"/);
  if(!m)throw new Error("sem _APP");
  const x=xdoc(await z.file("xl/worksheets/sheet"+m[1]+".xml").async("string"));
  const parts=[...x.getElementsByTagNameNS(XNS,"c")].filter(c=>/^A\d+$/.test(c.getAttribute("r"))&&c.getAttribute("r")!=="A1").map(c=>c.textContent);
  return JSON.parse(parts.join(""));
}
function baixar(nome,data,tipo){
  const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:tipo}));const a=document.createElement("a");
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}
function prepImport(o){
  if(!o||typeof o!=="object"||(!o.cfg&&!o.meses)){toast("Arquivo inválido: não é um backup deste app.");return}
  const meses={};for(const m in (o.meses||{}))if(/^\d{4}-\d{2}$/.test(m)&&o.meses[m]&&Array.isArray(o.meses[m].itens))meses[m]=o.meses[m];
  openSheet("imp",{cfg:o.cfg&&typeof o.cfg==="object"?o.cfg:null,meses,nM:Object.keys(meses).length,nI:Object.values(meses).reduce((a,m)=>a+m.itens.length,0)});
}
function lerImport(file){
  const r=new FileReader();
  if(/\.xlsx$/i.test(file.name)){
    r.onload=async()=>{try{prepImport(await lerBackupXlsx(r.result))}catch(e){toast("Este Excel não é um backup do app. Use o arquivo gerado em Excel backup.")}};
    r.readAsArrayBuffer(file);
  }else{
    r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast("Arquivo inválido: não é um backup deste app.");return}prepImport(o)};
    r.readAsText(file);
  }
}

  if(t.dataset.k){const o=scopeOf(t);if(o)o[t.dataset.k]=t.type==="checkbox"?t.checked:t.value;
    if(t.dataset.k==="d"&&o===F)F.fat="";

function memDb(seed){
  const st={cfg:seed.cfg,meses:seed.meses},dl=[],cl=[],meta={fromCache:false,hasPendingWrites:false};
  const snapCfg=()=>({exists:!!st.cfg,data:()=>clone(st.cfg),metadata:meta});
  const snapMes=()=>({docs:Object.keys(st.meses).map(id=>({id,data:()=>clone(st.meses[id])})),metadata:meta});
  return {
    doc:p=>({set:d=>{d=clone(d);if(p==="cfg/main"){st.cfg=d;setTimeout(()=>dl.forEach(n=>n(snapCfg())))}else{st.meses[p.split("/")[1]]=d;setTimeout(()=>cl.forEach(n=>n(snapMes())))}return Promise.resolve()},
             onSnapshot:n=>{dl.push(n);setTimeout(()=>n(snapCfg()))}}),
    collection:()=>({onSnapshot:n=>{cl.push(n);setTimeout(()=>n(snapMes()))}})
  };
}

    {id:"fx-luz",t:"D",g:"HABITAÇÃO",s:"LUZ",o:"Conta de luz",v:210,c:"pix",dia:12,ini,rec:false},

    {id:"fx-aca",t:"D",g:"SAÚDE",s:"ACADEMIA",o:"Academia",v:99.9,c:"cartao1",dia:3,ini}];
  const price=(S0,i,n)=>r2(S0*i/(1-Math.pow(1+i,-n)));

    {id:"inv-res",n:"Reserva de emergência",tipo:"caixinha",c:"pix",meta:20000,rm:"cdi",rv:100,liq:"diaria",venc:""}];
  const meses={};const M=m=>meses[m]||(meses[m]=emptyMes());

  render();
  slowT=setTimeout(()=>{if(!S.got.cfg||!S.got.meses){S.slow=true;if(!S.cfg)S.cfg=clone(DEF);render()}},navigator.onLine===false?1500:10000);
  const fail=e=>{clearTimeout(slowT);S.slow=false;if(e&&e.code==="permission-denied"){S.err="Sua conta não tem permissão para ler estes dados. Confira as regras do Firestore."}else if(!S.cfg)S.cfg=clone(DEF);render()};
  db.doc("cfg/main").onSnapshot(snap=>{
    S.cfg=snap.exists?normCfg(snap.data()):(S.cfg||clone(DEF));
    if(!snap.metadata.fromCache){S.got.cfg=true;checkReady()}
    render();
  },fail);
  db.collection("meses").onSnapshot(snap=>{
    const seen={};
    for(const d of snap.docs){seen[d.id]=1;const x=clone(d.data()||{});S.meses[d.id]={itens:Array.isArray(x.itens)?x.itens:[],skip:Array.isArray(x.skip)?x.skip:[],pagas:x.pagas||{},econ:x.econ||{},inv:x.inv||{}}}
    for(const m in S.meses)if(!seen[m])delete S.meses[m];
    if(!snap.metadata.fromCache){S.got.meses=true;checkReady()}
    render();
  },fail);
}
function checkReady(){if(S.got.cfg&&S.got.meses){clearTimeout(slowT);S.slow=false;if(!S.ready){S.ready=true;migraEcon();ensureAuto()}}}

fromHash();render();
